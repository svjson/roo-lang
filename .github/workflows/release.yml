name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-linux-x86_64:
    name: Validate Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev

      - name: Build validation artifacts
        run: |
          make -f Makefile.ci ci-build-libroo
          make -f Makefile.ci ci-build-libroo-package
          make -f Makefile.ci ci-build-libroo-server
          make -f Makefile.ci ci-build-tools
          make -f Makefile.ci ci-build-native-packages
          make -f Makefile.ci ci-build-loom
          make -f Makefile.ci ci-build-lookup
          make -f Makefile.ci ci-build-proof
          make -f Makefile.ci ci-build-proofread

      - name: Run validation tests
        run: |
          make -f Makefile.ci ci-test-lang
          make -f Makefile.ci ci-test-package
          make -f Makefile.ci ci-test-server
          make -f Makefile.ci ci-test-proof
          make -f Makefile.ci ci-test-workbook
          make -f Makefile.ci ci-test-footsteps
          make -f Makefile.ci ci-test-rooc
          make -f Makefile.ci ci-test-roo-cli
          make -f Makefile.ci ci-test-loom-cli
          make -f Makefile.ci ci-test-lookup-cli
          make -f Makefile.ci ci-test-proofread

  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: validate-linux-x86_64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            archive-pattern: dist/roo-*.tar.gz
          - platform: macos-arm64
            runner: macos-15
            archive-pattern: dist/roo-*.tar.gz
          - platform: macos-x86_64
            runner: macos-15-intel
            archive-pattern: dist/roo-*.tar.gz
          - platform: windows-x86_64
            runner: windows-2025
            archive-pattern: dist/roo-*.zip
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Build release archive
        run: ROO_RELEASE_JOBS=1 sh tools/release/package.sh

      - name: Rename checksum
        run: cp dist/SHA256SUMS "dist/SHA256SUMS-${{ matrix.platform }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: roo-${{ matrix.platform }}-release
          path: |
            ${{ matrix.archive-pattern }}
            dist/SHA256SUMS-${{ matrix.platform }}
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Download Linux x86_64 archive
        uses: actions/download-artifact@v8
        with:
          name: roo-linux-x86_64-release
          path: release-assets

      - name: Download macOS arm64 archive
        uses: actions/download-artifact@v8
        with:
          name: roo-macos-arm64-release
          path: release-assets

      - name: Download macOS x86_64 archive
        uses: actions/download-artifact@v8
        with:
          name: roo-macos-x86_64-release
          path: release-assets

      - name: Download Windows x86_64 archive
        uses: actions/download-artifact@v8
        with:
          name: roo-windows-x86_64-release
          path: release-assets

      - name: Write combined checksums
        run: |
          cat release-assets/SHA256SUMS-* > release-assets/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/roo-*.tar.gz \
              release-assets/roo-*.zip \
              release-assets/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "roo ${GITHUB_REF_NAME#v}" \
              --notes "Roo ${GITHUB_REF_NAME#v}" \
              release-assets/roo-*.tar.gz \
              release-assets/roo-*.zip \
              release-assets/SHA256SUMS
          fi
