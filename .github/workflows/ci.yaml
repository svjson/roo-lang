          path: artifacts

      - name: Download native package stage
        uses: actions/download-artifact@v8
        with:
          name: native-package-stage-${{ matrix.platform }}
          path: artifacts

      - name: Unpack tool and native package artifacts
        run: |
          cmake -E tar xzf "artifacts/build-tools-${{ matrix.platform }}.tar.gz"
          cmake -E tar xzf "artifacts/native-package-stage-${{ matrix.platform }}.tar.gz"

      - name: Run roo CLI tests
        run: ROO_BIN="$GITHUB_WORKSPACE/build/roo${{ runner.os == 'Windows' && '.exe' || '' }}" ROO_PACKAGE_STAGE_ROOT="$GITHUB_WORKSPACE/build/native-package-stage/pkg" sh bin/roo/test/run-cli-tests.sh "$GITHUB_WORKSPACE"

  test-loom-cli:
