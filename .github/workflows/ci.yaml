        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download package build tree
        uses: actions/download-artifact@v8
        with:
          name: build-libroo-package-${{ matrix.platform }}
          path: artifacts

      - name: Unpack package build tree
        run: cmake -E tar xzf "artifacts/build-libroo-package-${{ matrix.platform }}.tar.gz"

      - name: Build native package libraries
        run: >
          cmake --build build
          --config "$ROO_CI_CONFIG"
          --parallel "$ROO_CI_JOBS"
          --target stage_native_packages

      - name: Pack native package build tree
        run: cmake -E tar czf "build-native-packages-${{ matrix.platform }}.tar.gz" build

      - name: Upload native package build tree
        uses: actions/upload-artifact@v7
        with:
          name: build-native-packages-${{ matrix.platform }}
          path: build-native-packages-${{ matrix.platform }}.tar.gz
          retention-days: 3

      - name: Pack native package stage
        run: cmake -E tar czf "native-package-stage-${{ matrix.platform }}.tar.gz" build/native-package-stage

      - name: Upload native package stage
        uses: actions/upload-artifact@v7
        with:
          name: native-package-stage-${{ matrix.platform }}
          path: native-package-stage-${{ matrix.platform }}.tar.gz
          retention-days: 3

  test-proof:
    name: Test proof ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - platform-matrix
      - build-native-packages
    if: ${{ needs.platform-matrix.result == 'success' && !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download native package build tree
        uses: actions/download-artifact@v8
        with:
          name: build-native-packages-${{ matrix.platform }}
          path: artifacts

      - name: Unpack native package build tree
        run: cmake -E tar xzf "artifacts/build-native-packages-${{ matrix.platform }}.tar.gz"

      - name: Build and run proof tests
        run: |
          cmake --build build --config "$ROO_CI_CONFIG" --parallel "$ROO_CI_JOBS" --target testproof
          ./build/pkg/proof/test/testproof${{ runner.os == 'Windows' && '.exe' || '' }}

  test-workbook:
    name: Test workbook ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - platform-matrix
      - build-tools
      - build-native-packages
    if: ${{ needs.platform-matrix.result == 'success' && !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download tools build tree
        uses: actions/download-artifact@v8
        with:
          name: build-tools-${{ matrix.platform }}
          path: artifacts

      - name: Download native package stage
        uses: actions/download-artifact@v8
        with:
          name: native-package-stage-${{ matrix.platform }}
          path: artifacts

      - name: Unpack tool and native package artifacts
        run: |
          cmake -E tar xzf "artifacts/build-tools-${{ matrix.platform }}.tar.gz"
          cmake -E tar xzf "artifacts/native-package-stage-${{ matrix.platform }}.tar.gz"

      - name: Run workbook tests
        run: cd build/native-package-stage/pkg/workbook/test && "$GITHUB_WORKSPACE/build/roo${{ runner.os == 'Windows' && '.exe' || '' }}" proof

  test-boodle:
    name: Test boodle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - platform-matrix
      - build-tools
      - build-native-packages
    if: ${{ needs.platform-matrix.result == 'success' && !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download tools build tree
        uses: actions/download-artifact@v8
        with:
          name: build-tools-${{ matrix.platform }}
          path: artifacts

      - name: Download native package stage
        uses: actions/download-artifact@v8
        with:
          name: native-package-stage-${{ matrix.platform }}
          path: artifacts

      - name: Unpack tool and native package artifacts
        run: |
          cmake -E tar xzf "artifacts/build-tools-${{ matrix.platform }}.tar.gz"
          cmake -E tar xzf "artifacts/native-package-stage-${{ matrix.platform }}.tar.gz"

      - name: Run boodle tests
        run: cd build/native-package-stage/pkg/boodle/test && "$GITHUB_WORKSPACE/build/roo${{ runner.os == 'Windows' && '.exe' || '' }}" proof

  test-moordown:
    name: Test moordown ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - platform-matrix
      - build-tools
      - build-native-packages
    if: ${{ needs.platform-matrix.result == 'success' && !cancelled() }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Download tools build tree
        uses: actions/download-artifact@v8
