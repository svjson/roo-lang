          path: artifacts

      - name: Unpack tool and native package artifacts
        run: |
          cmake -E tar xzf "artifacts/build-tools-${{ matrix.platform }}.tar.gz"
          cmake -E tar xzf "artifacts/native-package-stage-${{ matrix.platform }}.tar.gz"

      - name: Build and run rooc tests
        env:
          ROO_CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
          ROO_CMAKE_C_COMPILER: ${{ matrix.c_compiler }}
          ROO_CMAKE_CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: |
          cmake --build build --config "$ROO_CI_CONFIG" --parallel "$ROO_CI_JOBS" --target testrooc
          ./build/bin/rooc/test/testrooc${{ runner.os == 'Windows' && '.exe' || '' }}

  test-roo-cli:
