name: Test

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: test-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  test-libroo:
    name: Test libroo
    runs-on: ubuntu-24.04
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev

      - name: Download libroo build
        uses: actions/download-artifact@v8
        with:
          name: build-libroo
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts

      - name: Unpack libroo build
        run: tar -xzf artifacts/build-libroo.tar.gz

      - name: Run libroo tests
        run: make -f Makefile.ci ci-test-lang

  test-libroo-package:
    name: Test libroo-package
