name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  platform-matrix:
    name: Load platform matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read platform matrix
        id: platforms
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open(".github/platforms.json", encoding="utf-8") as f:
              print("matrix=" + json.dumps(json.load(f), separators=(",", ":")))
          PY

  validate-linux-x86_64:
    name: Validate Linux x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtest-dev libgmock-dev

      - name: Build validation artifacts
        run: |
          make -f Makefile.ci ci-build-libroo
          make -f Makefile.ci ci-build-libroo-package
          make -f Makefile.ci ci-build-libroo-server
          make -f Makefile.ci ci-build-tools
          make -f Makefile.ci ci-build-native-packages
          make -f Makefile.ci ci-build-loom
          make -f Makefile.ci ci-build-lookup
          make -f Makefile.ci ci-build-proof
          make -f Makefile.ci ci-build-proofread

      - name: Run validation tests
        run: |
          make -f Makefile.ci ci-test-lang
          make -f Makefile.ci ci-test-package
          make -f Makefile.ci ci-test-server
          make -f Makefile.ci ci-test-proof
          make -f Makefile.ci ci-test-workbook
          make -f Makefile.ci ci-test-footsteps
          make -f Makefile.ci ci-test-rooc
          make -f Makefile.ci ci-test-roo-cli
          make -f Makefile.ci ci-test-loom-cli
          make -f Makefile.ci ci-test-lookup-cli
          make -f Makefile.ci ci-test-proofread

  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs:
      - platform-matrix
      - validate-linux-x86_64
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build release archive
        env:
          ROO_CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
          ROO_CMAKE_C_COMPILER: ${{ matrix.c_compiler }}
          ROO_CMAKE_CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: ROO_RELEASE_JOBS=1 sh tools/release/package.sh

      - name: Rename checksum
        run: cp dist/SHA256SUMS "dist/SHA256SUMS-${{ matrix.platform }}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: roo-${{ matrix.platform }}-release
          path: |
            ${{ matrix.archive-pattern }}
            dist/SHA256SUMS-${{ matrix.platform }}
          retention-days: 14

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify release tag
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            printf '%s\n' "Release tag '${GITHUB_REF_NAME}' does not match VERSION '${version}'." >&2
            exit 1
          fi

      - name: Download platform archives
        uses: actions/download-artifact@v8
        with:
          pattern: roo-*-release
          path: release-assets
          merge-multiple: true

      - name: Write combined checksums
        run: |
          cat release-assets/SHA256SUMS-* > release-assets/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              release-assets/roo-*.tar.gz \
              release-assets/roo-*.zip \
              release-assets/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "roo ${GITHUB_REF_NAME#v}" \
              --notes "Roo ${GITHUB_REF_NAME#v}" \
              release-assets/roo-*.tar.gz \
              release-assets/roo-*.zip \
              release-assets/SHA256SUMS
          fi
