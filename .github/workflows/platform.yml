name: Platform

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-matrix:
    name: Load platform matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Read platform matrix
        id: platforms
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open(".github/platforms.json", encoding="utf-8") as f:
              print("matrix=" + json.dumps(json.load(f), separators=(",", ":")))
          PY

  platform-test:
    name: Platform Test ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: platform-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platform-matrix.outputs.matrix) }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Run full platform test suite
        env:
          ROO_CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
          ROO_CMAKE_C_COMPILER: ${{ matrix.c_compiler }}
          ROO_CMAKE_CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: ROO_CI_JOBS=1 sh tools/ci/platform-test.sh

      - name: Build and smoke-test package
        env:
          ROO_CMAKE_GENERATOR: ${{ matrix.cmake_generator }}
          ROO_CMAKE_C_COMPILER: ${{ matrix.c_compiler }}
          ROO_CMAKE_CXX_COMPILER: ${{ matrix.cxx_compiler }}
        run: ROO_RELEASE_JOBS=1 sh tools/release/package.sh
