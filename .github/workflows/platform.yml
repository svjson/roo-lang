name: Platform

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-smoke:
    name: Package Smoke ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2025
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build and smoke-test package
        run: ROO_RELEASE_JOBS=1 sh tools/release/package.sh
